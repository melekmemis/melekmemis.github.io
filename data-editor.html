<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Data Editor — Portfolio Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0c0f;
      --bg2: #0f1217;
      --surface: #1a1f2e;
      --surface2: #1f2535;
      --border: #2a3040;
      --border2: #3a4560;
      --accent: #00d4ff;
      --accent2: #0099cc;
      --accent3: #00ff88;
      --warn: #ff6b35;
      --text: #e8eaf0;
      --text2: #8892a4;
      --text3: #4a5568;
      --mono: 'Space Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }

    /* Layout */
    .editor-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .form-panel {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }

    .preview-panel {
      width: 450px;
      padding: 2rem;
      background: var(--bg2);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Typography */
    h1 { font-size: 1.5rem; margin-bottom: 2rem; color: var(--accent); font-family: var(--mono); }
    h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--text2); display: flex; align-items: center; gap: 0.5rem; }
    h2::before { content: '▸'; color: var(--accent3); }

    /* Form Elements */
    .field-group { margin-bottom: 1.5rem; }
    label { display: block; font-family: var(--mono); font-size: 12px; color: var(--text3); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
    
    input, textarea, select {
      width: 100%;
      padding: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      transition: all 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface2);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    }

    textarea { min-height: 100px; resize: vertical; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* Dynamic Lists */
    .list-container {
      background: rgba(255,255,255,0.02);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    .list-item {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      align-items: center;
    }
    .list-item:last-child { margin-bottom: 0; }

    .btn {
      padding: 0.5rem 1rem;
      font-family: var(--mono);
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .btn-add { background: rgba(0, 255, 136, 0.1); color: var(--accent3); border-color: rgba(0, 255, 136, 0.2); }
    .btn-add:hover { background: var(--accent3); color: #000; }
    
    .btn-remove { background: rgba(255, 107, 53, 0.1); color: var(--warn); border-color: rgba(255, 107, 53, 0.2); padding: 0.5rem; }
    .btn-remove:hover { background: var(--warn); color: #fff; }

    .btn-primary { background: var(--accent); color: #000; font-weight: 700; width: 100%; padding: 0.8rem; font-size: 13px; }
    .btn-primary:hover { background: #33ddff; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0, 212, 255, 0.2); }

    .btn-secondary { background: var(--surface2); color: var(--text2); border-color: var(--border2); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* Process Step Specific */
    .process-item {
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      position: relative;
    }
    .process-item .btn-remove { position: absolute; top: 0.5rem; right: 0.5rem; }

    /* Code Preview */
    #codeOutput {
      flex: 1;
      width: 100%;
      background: #000;
      color: #00ff88;
      font-family: var(--mono);
      font-size: 12px;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      white-space: pre-wrap;
      overflow-y: auto;
      margin-bottom: 1rem;
    }

    .copy-success {
      color: var(--accent3);
      font-family: var(--mono);
      font-size: 11px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .copy-success.show { opacity: 1; }

    .tag-chip {
      display: inline-block;
      padding: 2px 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      margin-right: 4px;
      margin-bottom: 4px;
    }

    .step-img-list { margin-top: 0.5rem; padding-left: 1rem; border-left: 1px solid var(--border2); }
  </style>
</head>
<body>

  <div class="editor-container">
    <div class="form-panel" id="formPanel">
      <h1>PROJECT DATA EDITOR</h1>

      <div class="row">
        <div class="field-group">
          <label>Project ID (URL Friendly)</label>
          <input type="text" id="projId" placeholder="e.g. stm32-fcu" oninput="updatePreview()">
        </div>
        <div class="field-group">
          <label>Status</label>
          <select id="projStatus" onchange="updatePreview()">
            <option value="Tamamlandı">Tamamlandı</option>
            <option value="Devam Ediyor">Devam Ediyor</option>
            <option value="Aktif">Aktif</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field-group">
          <label>Title</label>
          <input type="text" id="projTitle" placeholder="Project Name" oninput="updatePreview()">
        </div>
        <div class="field-group">
          <label>Icon (Emoji)</label>
          <input type="text" id="projIcon" placeholder="🚀" oninput="updatePreview()">
        </div>
      </div>

      <div class="field-group">
        <label>Description</label>
        <textarea id="projDesc" placeholder="Brief project description..." oninput="updatePreview()"></textarea>
      </div>

      <h2>Tags</h2>
      <div class="list-container" id="tagsList">
        <div class="list-item">
          <input type="text" class="tag-input" placeholder="e.g. Altium Designer" oninput="updatePreview()">
          <button class="btn btn-remove" onclick="removeItem(this)">✕</button>
        </div>
      </div>
      <button class="btn btn-add" onclick="addTag()">+ Add Tag</button>

      <h2 style="margin-top: 2rem;">Links</h2>
      <div class="list-container" id="linksList">
        <div class="list-item">
          <input type="text" class="link-label" placeholder="Label" oninput="updatePreview()">
          <input type="text" class="link-url" placeholder="URL" oninput="updatePreview()">
          <button class="btn btn-remove" onclick="removeItem(this)">✕</button>
        </div>
      </div>
      <button class="btn btn-add" onclick="addLink()">+ Add Link</button>

      <h2 style="margin-top: 2rem;">Process Steps</h2>
      <div id="processList">
        <!-- Process steps will be added here -->
      </div>
      <button class="btn btn-add" onclick="addProcessStep()">+ Add Process Step</button>

      <h2 style="margin-top: 2rem;">Main Gallery (Project Images)</h2>
      <div class="list-container" id="galleryList">
        <div class="list-item">
          <input type="text" class="gallery-path" placeholder="Image path or Video path (.mp4)" oninput="updatePreview()">
          <button class="btn btn-remove" onclick="removeItem(this)">✕</button>
        </div>
      </div>
      <button class="btn btn-add" onclick="addGalleryItem()">+ Add Image/Video</button>

      <div style="height: 100px;"></div> <!-- Spacer -->
    </div>

    <div class="preview-panel">
      <h1>OUTPUT CODE</h1>
      <div id="codeOutput"></div>
      <button class="btn btn-primary" onclick="copyCode()">COPY TO CLIPBOARD</button>
      <div id="copyNotice" class="copy-success">Code copied successfully!</div>
      
      <div style="margin-top: auto;">
        <button class="btn btn-secondary" style="width: 100%;" onclick="resetForm()">RESET FORM</button>
      </div>
    </div>
  </div>

  <script>
    const STATUS_CLASSES = {
      "Tamamlandı": "status-done",
      "Devam Ediyor": "status-dev",
      "Aktif": "status-active"
    };

    function addTag() {
      const container = document.getElementById('tagsList');
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `
        <input type="text" class="tag-input" placeholder="New Tag" oninput="updatePreview()">
        <button class="btn btn-remove" onclick="removeItem(this)">✕</button>
      `;
      container.appendChild(div);
      updatePreview();
    }

    function addLink() {
      const container = document.getElementById('linksList');
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `
        <input type="text" class="link-label" placeholder="Label" oninput="updatePreview()">
        <input type="text" class="link-url" placeholder="URL" oninput="updatePreview()">
        <button class="btn btn-remove" onclick="removeItem(this)">✕</button>
      `;
      container.appendChild(div);
      updatePreview();
    }

    function addProcessStep() {
      const container = document.getElementById('processList');
      const div = document.createElement('div');
      div.className = 'process-item';
      div.innerHTML = `
        <button class="btn btn-remove" onclick="removeItem(this)">✕</button>
        <div class="field-group">
          <label>Step Text</label>
          <textarea class="step-text" placeholder="Explain this phase..." oninput="updatePreview()"></textarea>
        </div>
        <div class="field-group">
          <label>Step Images (Optional)</label>
          <div class="step-img-list">
            <div class="list-item">
              <input type="text" class="step-img-path" placeholder="Image path" oninput="updatePreview()">
              <button class="btn btn-remove" onclick="removeItem(this)">✕</button>
            </div>
          </div>
          <button class="btn btn-add btn-small" onclick="addStepImage(this)" style="padding: 0.3rem 0.6rem; font-size: 10px;">+ Add Image</button>
        </div>
      `;
      container.appendChild(div);
      updatePreview();
    }

    function addStepImage(btn) {
      const container = btn.previousElementSibling;
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `
        <input type="text" class="step-img-path" placeholder="Image path" oninput="updatePreview()">
        <button class="btn btn-remove" onclick="removeItem(this)">✕</button>
      `;
      container.appendChild(div);
      updatePreview();
    }

    function addGalleryItem() {
      const container = document.getElementById('galleryList');
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `
        <input type="text" class="gallery-path" placeholder="Path" oninput="updatePreview()">
        <button class="btn btn-remove" onclick="removeItem(this)">✕</button>
      `;
      container.appendChild(div);
      updatePreview();
    }

    function removeItem(btn) {
      btn.parentElement.remove();
      updatePreview();
    }

    function updatePreview() {
      const project = {
        id: document.getElementById('projId').value,
        title: document.getElementById('projTitle').value,
        status: document.getElementById('projStatus').value,
        statusClass: STATUS_CLASSES[document.getElementById('projStatus').value],
        icon: document.getElementById('projIcon').value,
        description: document.getElementById('projDesc').value,
        tags: Array.from(document.querySelectorAll('.tag-input')).map(i => i.value).filter(v => v),
        links: Array.from(document.querySelectorAll('#linksList .list-item')).map(item => ({
          label: item.querySelector('.link-label').value,
          url: item.querySelector('.link-url').value
        })).filter(l => l.label && l.url),
        process: Array.from(document.querySelectorAll('.process-item')).map(item => {
          const text = item.querySelector('.step-text').value;
          const imgs = Array.from(item.querySelectorAll('.step-img-path')).map(i => i.value).filter(v => v);
          
          if (!text && imgs.length === 0) return null;
          
          const step = { text };
          if (imgs.length === 1) step.image = imgs[0];
          else if (imgs.length > 1) step.images = imgs;
          
          return step;
        }).filter(s => s),
        images: Array.from(document.querySelectorAll('.gallery-path')).map(i => {
          const path = i.value;
          if (!path) return null;
          if (path.toLowerCase().endsWith('.mp4')) {
            return { url: path, poster: "poster-path-here.jpg" };
          }
          return path;
        }).filter(v => v)
      };

      const code = JSON.stringify(project, null, 2);
      // Clean up the output to look like the original (JS object, not strict JSON)
      const formattedCode = code
        .replace(/"([^"]+)":/g, '$1:') // Remove quotes from keys
        .replace(/"/g, "'");           // Use single quotes

      document.getElementById('codeOutput').innerText = `  {\n${formattedCode.split('\n').slice(1).join('\n')},`;
    }

    function copyCode() {
      const text = document.getElementById('codeOutput').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const notice = document.getElementById('copyNotice');
        notice.classList.add('show');
        setTimeout(() => notice.classList.remove('show'), 2000);
      });
    }

    function resetForm() {
      if (confirm('Are you sure you want to clear the form?')) {
        location.reload();
      }
    }

    // Initial state
    window.onload = () => {
      // Add one empty process step
      addProcessStep();
      updatePreview();
    };
  </script>
</body>
</html>
